groups:
  - name: mediflow_alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on MediFlow Node"
          description: "CPU usage is above 85% for more than 2 minutes."

      - alert: ContainerDown
        expr: time() - container_last_seen{name=~"hospital_ai_backend|hospital_ai_frontend"} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MediFlow Hospital Container Down"
          description: "Container {{ $labels.name }} has been down for over 1 minute."

      - alert: HighHttp5xxErrors
        expr: rate(django_http_responses_total_by_status{status=~"5.."}[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Clinical API Error Spike"
          description: "Django backend is returning high 5xx error rates."
