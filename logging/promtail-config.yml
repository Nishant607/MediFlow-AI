server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mediflow_system_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: mediflow_logs
          env: production
          __path__: /var/log/*log

  - job_name: mediflow_containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: container_logs
          app: mediflow-ai
          __path__: /var/lib/docker/containers/*/*-json.log
