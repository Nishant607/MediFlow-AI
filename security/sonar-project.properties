# ===================================================================
# Phase 9: SonarQube Static Application Security Testing (SAST)
# ===================================================================

sonar.projectKey=mediflow-ai
sonar.projectName=MediFlow-AI Hospital Management System
sonar.projectVersion=1.0.0

# Source directories for analysis
sonar.sources=backend,frontend/src
sonar.tests=backend/apps,backend/e2e_tests

# Language configurations
sonar.python.version=3.10,3.11,3.12,3.15
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/migrations/**,**/tests/**,**/node_modules/**,**/staticfiles/**,**/media/**
sonar.coverage.exclusions=**/tests/**,**/manage.py,**/wsgi.py,**/asgi.py

# Quality Gate Thresholds
sonar.qualitygate.wait=true
