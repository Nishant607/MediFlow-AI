apiVersion: v1
kind: ConfigMap
metadata:
  name: mediflow-config
  namespace: mediflow
data:
  DJANGO_ENV: "production"
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:3000,http://localhost:30080,http://127.0.0.1:30080"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "hospital_db"
  DATABASE_USER: "hospital_user"
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/0"
  VITE_API_BASE_URL: "/api"
