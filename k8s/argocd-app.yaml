# ===================================================================
# Phase 11: GitOps Application Definition (ArgoCD)
# ===================================================================
# Declaratively defines the desired state of MediFlow-AI in Kubernetes.
# ArgoCD continuously reconciles the live cluster with the Git repo.
# ===================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediflow-ai
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mediflow-org/mediflow-ai.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mediflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
