---
# ===================================================================
# Playbook 4: Host System Hardening & Security Baseline
# ===================================================================
- name: Apply Baseline Security and Firewall Rules
  hosts: mediflow_servers
  become: true
  tasks:
    - name: Install UFW firewall and fail2ban
      apt:
        name:
          - ufw
          - fail2ban
        state: present
        update_cache: true

    - name: Allow SSH (Port 22)
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP (Port 80)
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS (Port 443)
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Allow MediFlow NodePort (Port 30080)
      ufw:
        rule: allow
        port: '30080'
        proto: tcp

    - name: Enable UFW firewall with default deny incoming
      ufw:
        state: enabled
        default: deny
        direction: incoming
