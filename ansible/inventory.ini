# ===================================================================
# MediFlow-AI — Target Server Inventory
# Replace IP addresses with your actual provisioned server IPs
# ===================================================================

[mediflow_servers]
mediflow-master ansible_host=127.0.0.1 ansible_connection=local
# Example remote target:
# mediflow-node-1 ansible_host=54.210.12.89 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/mediflow-key.pem

[k8s_cluster:children]
mediflow_servers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
mediflow_app_dir=/opt/mediflow-ai
mediflow_git_repo=https://github.com/mediflow-org/mediflow-ai.git
